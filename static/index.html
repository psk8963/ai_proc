<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro*C 영향도 분석 에이전트</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f3f4f6;
            --panel-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --ok: #16a34a;
            --warn: #d97706;
            --err: #dc2626;
            --mono: Consolas, "D2Coding", "Courier New", monospace;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0; padding: 20px; background-color: var(--bg-color); color: var(--text-main);
        }
        .container { max-width: 1600px; margin: 0 auto; display: flex; gap: 20px; height: calc(100vh - 40px); }
        .panel {
            background: var(--panel-bg); padding: 20px; border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
        }
        .sidebar { width: 310px; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; gap: 4px; }
        .main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
        h3 { margin: 0 0 10px; color: var(--text-main); font-size: 1.02rem; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        h4 { margin: 14px 0 6px; font-size: 0.88rem; color: var(--text-main); }
        .muted { color: var(--text-muted); font-size: 0.82rem; }
        .mono { font-family: var(--mono); }

        button {
            padding: 9px 14px; background: var(--primary-color); color: white; border: none;
            border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; font-size: 0.86rem;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #93c5fd; cursor: not-allowed; }
        button.ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); font-weight: 500; }
        button.ghost:hover { background: #f1f5f9; }
        button.small { padding: 4px 9px; font-size: 0.76rem; }
        button.danger { background: transparent; color: var(--err); border: 1px solid #fecaca; }
        button.danger:hover { background: #fef2f2; }
        input[type="text"], input[type="number"], select, textarea {
            padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.88rem; outline: none;
            font-family: inherit; background: #fff; min-width: 0;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary-color); }
        input[type="file"] { width: 100%; font-size: 0.82rem; margin: 4px 0 6px; }
        .row { display: flex; gap: 8px; align-items: center; }
        .row > * { flex-shrink: 1; }
        .grow { flex: 1; }
        .status-line { font-size: 0.8rem; margin: 6px 0 0; min-height: 1em; white-space: pre-wrap; }
        .status-line.ok { color: var(--ok); } .status-line.err { color: var(--err); }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0; }
        .stat { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 8px; }
        .stat .n { font-weight: 700; font-size: 1rem; }
        .stat .l { font-size: 0.7rem; color: var(--text-muted); }
        .db-box { font-size: 0.82rem; background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 10px; }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #9ca3af; }
        .dot.on { background: var(--ok); } .dot.off { background: var(--err); }

        /* 탭 */
        .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border-color); margin-bottom: 12px; flex-shrink: 0; }
        .tabs button { background: transparent; color: var(--text-muted); border-radius: 8px 8px 0 0; padding: 10px 16px; font-size: 0.9rem; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tabs button:hover { background: #f1f5f9; }
        .tabs button.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-page { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
        .tab-page.active { display: flex; }
        .scroll { overflow: auto; min-height: 0; }

        /* 대화 */
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 10px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 14px; }
        .msg-wrapper { display: flex; width: 100%; }
        .msg-wrapper.user { justify-content: flex-end; }
        .msg { max-width: 88%; padding: 12px 16px; border-radius: 16px; line-height: 1.6; font-size: 0.92rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); overflow-wrap: break-word; min-width: 0; }
        .msg.user { background: var(--primary-color); color: white; border-bottom-right-radius: 4px; white-space: pre-wrap; }
        .msg.bot { background: #f8fafc; border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }
        .msg.bot.error { border-color: #fecaca; background: #fef2f2; }
        .msg h1, .msg h2, .msg h3, .msg h4, .msg h5 { font-size: 0.98rem; margin: 14px 0 6px; border: none; padding: 0; }
        .msg p { margin: 6px 0; }
        .msg ul, .msg ol { margin: 6px 0; padding-left: 22px; }
        .input-area { display: flex; gap: 10px; flex-shrink: 0; }
        .input-area input { flex: 1; padding: 13px 14px; }
        .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .examples button { background: #eef2ff; color: #3730a3; font-weight: 500; padding: 5px 10px; font-size: 0.8rem; }
        .examples button:hover { background: #e0e7ff; }

        .badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-right: 6px; white-space: nowrap; }
        .badge.SUCCESS { background: #dcfce7; color: var(--ok); }
        .badge.UNCERTAIN { background: #fef3c7; color: var(--warn); }
        .badge.INSUFFICIENT_EVIDENCE { background: #fee2e2; color: var(--err); }
        .badge.intent { background: #e0e7ff; color: #3730a3; }
        .badge.ERROR { background: #fee2e2; color: var(--err); }
        .badge.WARN { background: #fef3c7; color: #b45309; }
        .badge.INFO { background: #e0f2fe; color: #0369a1; }
        .badge.R { background: #e0f2fe; color: #0369a1; } .badge.W { background: #fee2e2; color: var(--err); }
        .badge.RW { background: #fae8ff; color: #86198f; } .badge.Q { background: #f1f5f9; color: var(--text-muted); }
        .notes { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: #fffbeb; border: 1px solid #fde68a; font-size: 0.83rem; }
        .notes ul { margin: 0; padding-left: 18px; }
        .evidence { font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; background: #f1f5f9; padding: 8px 10px; border-radius: 8px; }
        .evidence summary { cursor: pointer; font-weight: 600; }
        .evidence ul { padding-left: 20px; margin: 6px 0 0; }
        .typing { display: inline-flex; gap: 4px; }
        .typing span { animation: blink 1.4s infinite both; height: 6px; width: 6px; background: var(--text-muted); border-radius: 50%; }
        .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        pre { background: #1e293b; color: #f8fafc; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 0.82rem; margin: 6px 0; font-family: var(--mono); }
        code.inline { background: #e2e8f0; padding: 1px 5px; border-radius: 4px; font-size: 0.88em; font-family: var(--mono); }
        table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.82rem; }
        th, td { border: 1px solid var(--border-color); padding: 6px 8px; text-align: left; vertical-align: top; }
        th { background: #f1f5f9; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
        td.code { white-space: nowrap; font-family: var(--mono); }
        tr.clickable { cursor: pointer; } tr.clickable:hover td { background: #eff6ff; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; }

        /* 영향도 */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; align-items: end; }
        .form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }
        .form-grid label.check { flex-direction: row; align-items: center; gap: 6px; font-weight: 500; }
        .summary-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
        .chip { border-radius: 10px; padding: 8px 12px; border: 1px solid var(--border-color); background: #fff; font-size: 0.82rem; }
        .chip b { font-size: 1.1rem; margin-right: 4px; }
        .chip.e b { color: var(--err); } .chip.w b { color: #b45309; } .chip.i b { color: #0369a1; }
        .result-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 14px; margin: 10px 0; background: #fff; }
        .result-card h4 { margin-top: 0; }
        .msg-cell { max-width: 520px; }
        .path { color: var(--text-muted); font-size: 0.75rem; }

        /* DB / 탐색 */
        .split { display: flex; gap: 14px; flex: 1; min-height: 0; }
        .list-pane { width: 290px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--border-color); border-radius: 10px; }
        .list-pane input { margin: 8px; }
        .list-items { overflow: auto; flex: 1; }
        .list-items div.item { padding: 7px 10px; border-top: 1px solid var(--border-color); cursor: pointer; font-size: 0.82rem; }
        .list-items div.item:hover { background: #f1f5f9; }
        .list-items div.item.active { background: #eff6ff; }
        .list-items .sub { color: var(--text-muted); font-size: 0.72rem; }
        a.objlink { color: var(--primary-color); text-decoration: none; font-family: var(--mono); }
        a.objlink:hover { text-decoration: underline; }
        .detail-pane { flex: 1; min-width: 0; overflow: auto; }
        textarea.sql { width: 100%; height: 130px; font-family: var(--mono); font-size: 0.85rem; resize: vertical; }
        .grid-wrap { overflow: auto; max-height: 48vh; border: 1px solid var(--border-color); border-radius: 8px; }
        .grid-wrap table { margin: 0; }
        .grid-wrap td { white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 0.78rem; }
        .seg { display: inline-flex; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .seg button { background: transparent; color: var(--text-muted); border-radius: 0; padding: 6px 12px; }
        .seg button.active { background: #eff6ff; color: var(--primary-color); }

        /* 코드 보기 */
        .modal-back { position: fixed; inset: 0; background: rgba(15,23,42,0.45); display: none; z-index: 50; align-items: center; justify-content: center; padding: 20px; }
        .modal-back.open { display: flex; }
        .modal { background: #fff; border-radius: 14px; width: min(1100px, 100%); max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
        .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-color); gap: 10px; }
        .modal-body { overflow: auto; padding: 0; background: #0f172a; }
        .code-lines { font-family: var(--mono); font-size: 0.8rem; color: #e2e8f0; margin: 0; padding: 8px 0; }
        .code-lines div { white-space: pre; padding: 0 14px 0 0; }
        .code-lines .ln { display: inline-block; width: 58px; color: #64748b; text-align: right; padding-right: 12px; user-select: none; }
        .code-lines .hl { background: #854d0e55; }
        .code-lines .sql { color: #93c5fd; }

        @media (max-width: 1000px) {
            body { padding: 12px; }
            .container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; }
            .main { height: 88vh; }
            .split { flex-direction: column; }
            .list-pane { width: 100%; max-height: 260px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 사이드바: 자산 등록 / 현황 / DB -->
    <div class="panel sidebar">
        <h3>분석 자산 등록</h3>
        <div class="muted">① Pro*C 소스 (.pc .c .h, zip 가능)</div>
        <input type="file" id="srcFiles" multiple accept=".pc,.pcc,.c,.cpp,.h,.hpp,.zip">
        <button onclick="uploadAssets('source')">소스 업로드</button>
        <div class="muted" style="margin-top:10px">② 배치 스크립트 (.sh .ksh .bat ..., zip 가능)</div>
        <input type="file" id="batchFiles" multiple>
        <button onclick="uploadAssets('batch')">배치 업로드</button>
        <details style="margin-top:10px">
            <summary class="muted" style="cursor:pointer">이 PC 폴더에서 바로 가져오기</summary>
            <input type="text" id="folderPath" placeholder="예: D:\src\batch\proc" style="width:100%;margin:6px 0">
            <div class="row">
                <select id="folderKind"><option value="source">소스</option><option value="batch">배치</option></select>
                <button class="grow" onclick="importFolder()">가져오기</button>
            </div>
        </details>
        <p id="uploadStatus" class="status-line" role="status"></p>

        <h3 style="margin-top:12px">등록 현황</h3>
        <div class="stats" id="stats"></div>
        <div id="statWarn" class="muted"></div>
        <div class="row" style="margin-top:6px">
            <button class="danger small" onclick="clearAssets('source')">소스 비우기</button>
            <button class="danger small" onclick="clearAssets('batch')">배치 비우기</button>
        </div>

        <h3 style="margin-top:16px">Oracle DB</h3>
        <div class="db-box" id="dbBox">불러오는 중…</div>
        <div class="row" style="margin-top:8px">
            <button class="ghost small grow" onclick="checkDb()">연결 확인</button>
            <button class="small grow" id="refreshMetaBtn" onclick="refreshMeta()" title="소스가 쓰는 테이블 정보를 한 번에 저장(집 PC 오프라인 분석용). 평소에는 분석할 때 필요한 테이블만 자동으로 읽습니다.">메타데이터 저장</button>
        </div>
        <p id="dbStatus" class="status-line"></p>
        <div class="muted" id="llmInfo" style="margin-top:auto;padding-top:10px"></div>
    </div>

    <!-- 메인 -->
    <div class="panel main">
        <div class="tabs" role="tablist">
            <button class="active" data-tab="chat">에이전트 대화</button>
            <button data-tab="impact">영향도 분석</button>
            <button data-tab="db">DB 조회</button>
            <button data-tab="explore">소스 · 배치</button>
        </div>

        <!-- 1. 대화 -->
        <section class="tab-page active" id="tab-chat">
            <div id="chat-box" aria-live="polite"></div>
            <div class="row" style="justify-content:space-between;margin-bottom:6px">
                <span class="muted">테이블.컬럼 이름을 넣어 질문하면 정확해집니다.</span>
                <button class="ghost small" onclick="resetConversation()">새 대화</button>
            </div>
            <div class="input-area">
                <input type="text" id="queryInput" aria-label="질문" placeholder="예: TB_CUST.CUST_NM 길이를 50으로 늘리면 어디서 에러가 나?"
                       onkeydown="if(event.key === 'Enter' && !event.isComposing) sendQuery()">
                <button id="sendBtn" onclick="sendQuery()" style="min-width:90px">전송</button>
            </div>
        </section>

        <!-- 2. 영향도 분석 -->
        <section class="tab-page" id="tab-impact">
            <div class="scroll" style="flex:1">
                <div class="form-grid">
                    <label>테이블<input type="text" id="impTable" list="tableList" placeholder="TB_ORDER" onchange="loadColumnsFor(this.value)"></label>
                    <label>컬럼<input type="text" id="impColumn" list="columnList" placeholder="STATUS"></label>
                    <label>변경 종류<select id="impChange" onchange="renderImpactFields()"></select></label>
                    <span id="impFields" style="display:contents"></span>
                </div>
                <div class="row" style="margin-top:12px;flex-wrap:wrap">
                    <label class="muted row" style="gap:6px"><input type="checkbox" id="impDb"> DB 로 건수/분포 확인 (DB 연결 시)</label>
                    <span class="grow"></span>
                    <button onclick="runImpact(false)" id="impBtn">영향도 분석</button>
                    <button onclick="runImpact(true)" id="impExplainBtn" class="ghost">분석 + 설명 보고서(LLM)</button>
                </div>
                <p id="impStatus" class="status-line"></p>
                <div id="impResult"></div>
            </div>
            <datalist id="tableList"></datalist>
            <datalist id="columnList"></datalist>
        </section>

        <!-- 3. DB 조회 -->
        <section class="tab-page" id="tab-db">
            <div class="split">
                <div class="list-pane">
                    <div id="objControls" class="row" style="margin:8px 8px 0;display:none">
                        <select id="objOwner" class="grow" onchange="loadObjects(false)" title="스키마"></select>
                        <button class="ghost small" onclick="loadObjects(true)" title="목록 새로 읽기">↻</button>
                    </div>
                    <select id="objType" style="margin:8px 8px 0;display:none" onchange="renderTableList()"></select>
                    <input type="text" id="tblFilter" placeholder="이름 검색" oninput="renderTableList()">
                    <div class="muted" id="objInfo" style="padding:0 10px 6px"></div>
                    <div class="list-items" id="tblItems"></div>
                </div>
                <div class="detail-pane">
                    <div id="tblDetail" class="muted">왼쪽에서 오브젝트를 고르면 컬럼·소스와 사용하는 Pro*C 를 보여줍니다.</div>
                    <h4>SQL 실행 <span class="muted">(SELECT / WITH 만, 읽기 전용 트랜잭션 · Ctrl+Enter)</span></h4>
                    <textarea class="sql" id="sqlText" placeholder="SELECT * FROM TB_ORDER WHERE STATUS = '01'"
                              onkeydown="if((event.ctrlKey||event.metaKey) && event.key==='Enter'){event.preventDefault();runSql();}"></textarea>
                    <div class="row" style="margin:6px 0">
                        <button onclick="runSql()" id="sqlBtn">실행</button>
                        <label class="muted row" style="gap:6px">최대 행 <input type="number" id="sqlMax" value="200" min="1" max="5000" style="width:90px"></label>
                        <span class="grow"></span>
                        <span id="sqlStatus" class="status-line"></span>
                    </div>
                    <div id="sqlResult"></div>
                </div>
            </div>
        </section>

        <!-- 4. 소스 · 배치 -->
        <section class="tab-page" id="tab-explore">
            <div class="split">
                <div class="list-pane">
                    <div class="seg" style="margin:8px">
                        <button class="active" data-kind="programs" onclick="setExploreKind('programs', this)">프로그램</button>
                        <button data-kind="batches" onclick="setExploreKind('batches', this)">배치</button>
                    </div>
                    <input type="text" id="expFilter" placeholder="검색" oninput="renderExploreList()">
                    <div class="list-items" id="expItems"></div>
                </div>
                <div class="detail-pane" id="expDetail"><span class="muted">왼쪽에서 프로그램이나 배치 스크립트를 고르세요.</span></div>
            </div>
        </section>
    </div>
</div>

<!-- 코드 보기 -->
<div class="modal-back" id="codeModal" onclick="if(event.target===this) closeCode()">
    <div class="modal">
        <div class="modal-head">
            <div><b id="codeTitle"></b> <span class="muted" id="codeSub"></span></div>
            <div class="row"><button class="ghost small" onclick="moreCode(-40)">▲ 위로</button><button class="ghost small" onclick="moreCode(40)">▼ 아래로</button><button class="ghost small" onclick="closeCode()">닫기</button></div>
        </div>
        <div class="modal-body"><div class="code-lines" id="codeLines"></div></div>
    </div>
</div>

<script>
    // ---------- 공통 ----------
    function esc(s) {
        return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function inline(s) {
        return s.replace(/`([^`]+)`/g, '<code class="inline">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    }
    function isTableSep(line) { return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line); }
    function splitRow(line) {
        return line.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
    }
    const FENCE = /```[ \t]*([\w+-]*)[^\n]*\n([\s\S]*?)```/g;
    function renderMarkdownText(text) {
        const lines = text.split('\n');
        let html = '', i = 0, para = [];
        const flush = () => { if (para.length) { html += '<p>' + inline(esc(para.join('\n'))).replace(/\n/g, '<br>') + '</p>'; para = []; } };
        while (i < lines.length) {
            const line = lines[i]; let m;
            if (!line.trim()) { flush(); i++; continue; }
            if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flush(); html += `<h${m[1].length + 1}>${inline(esc(m[2]))}</h${m[1].length + 1}>`; i++; continue; }
            if (line.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
                flush();
                const head = splitRow(line); i += 2;
                let t = '<table><thead><tr>' + head.map(c => `<th>${inline(esc(c))}</th>`).join('') + '</tr></thead><tbody>';
                while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {
                    t += '<tr>' + splitRow(lines[i]).map(c => `<td>${inline(esc(c))}</td>`).join('') + '</tr>'; i++;
                }
                html += t + '</tbody></table>'; continue;
            }
            if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
                flush();
                const ordered = /^\s*\d+[.)]/.test(line);
                const itemRe = ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/;
                let items = '';
                while (i < lines.length && itemRe.test(lines[i])) { items += '<li>' + inline(esc(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ''))) + '</li>'; i++; }
                html += ordered ? `<ol>${items}</ol>` : `<ul>${items}</ul>`; continue;
            }
            para.push(line); i++;
        }
        flush();
        return html;   // esc()를 거친 문자열만 들어간다
    }
    function renderMarkdown(text, container) {
        let last = 0, m, html = '';
        FENCE.lastIndex = 0;
        while ((m = FENCE.exec(text)) !== null) {
            if (m.index > last) html += renderMarkdownText(text.slice(last, m.index));
            html += `<pre>${esc(m[2].replace(/\n$/, ''))}</pre>`;
            last = FENCE.lastIndex;
        }
        if (last < text.length) html += renderMarkdownText(text.slice(last));
        const div = document.createElement('div');
        div.innerHTML = html;
        container.appendChild(div);
    }
    function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

    async function sendQuery() {
        if (busy) return;
        const input = document.getElementById('queryInput');
        const q = input.value.trim();
        if (!q) return;
        addBubble('user').m.textContent = q;
        input.value = '';
        const { m: wait } = addBubble('bot');
        wait.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
        setBusy(true);
        const fd = new FormData();
        fd.append('query', q);
        fd.append('history', JSON.stringify(history));
        try {
            const r = await api('/api/chat', { method: 'POST', body: fd });
            wait.replaceChildren();
            const head = el('div');
            head.innerHTML = `<span class="badge ${esc(r.status)}">${esc(r.status)}</span><span class="badge intent">${esc(r.intent)} · ${esc(r.decided_by)}</span>`;
            wait.appendChild(head);

            if (r.impact) wait.appendChild(impactNode(r.impact, true));
            if (r.notes && r.notes.length) {
                const n = el('div', 'notes'), ul = el('ul');
                r.notes.forEach(x => ul.appendChild(el('li', null, x))); n.appendChild(ul); wait.appendChild(n);
            }
            if (r.evidence && r.evidence.length) {

                const ul = el('ul'); r.evidence.forEach(e => ul.appendChild(el('li', null, e.source + (e.snippet ? ' — ' + e.snippet : ''))));

                wait.appendChild(d);

            history = history.slice(-6);

            wait.classList.add('error');

    }

    function renderImpactFields() {
        const ch = document.getElementById('impChange').value;
        const box = document.getElementById('impFields');
        box.replaceChildren();
        (FIELD_DEFS[ch] || []).forEach(([key, label, type, opts]) => {
            const l = el('label', type === 'check' ? 'check' : null);
            let input;
            if (type === 'select') {
                input = el('select');
                opts.forEach(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; const op = el('option', null, t); op.value = v; input.appendChild(op); });
            } else {
                input = el('input'); input.type = type === 'check' ? 'checkbox' : type;
            }
            input.dataset.key = key;
            if (type === 'check') { l.append(input, document.createTextNode(label)); }
            else { l.append(document.createTextNode(label), input); }
            box.appendChild(l);
        });
        document.getElementById('impColumn').disabled = ['drop_table', 'rename_table'].includes(ch);
    }
    function impactBody() {
        const body = { table: document.getElementById('impTable').value.trim(), change: document.getElementById('impChange').value,
                       run_db_checks: document.getElementById('impDb').checked };
        const col = document.getElementById('impColumn').value.trim();
        if (col && !document.getElementById('impColumn').disabled) body.column = col;
        document.querySelectorAll('#impFields [data-key]').forEach(i => {
            const k = i.dataset.key;
            if (i.type === 'checkbox') { body[k] = i.checked; return; }
            const v = i.value.trim();
            if (v === '') return;
            if (k === 'nullable') body[k] = v === 'true';
            else if (i.type === 'number') body[k] = parseInt(v, 10);
            else body[k] = v;
        });
        return body;
    }
    async function runImpact(explain) {

    function impactNode(r, compact) {
        const root = el('div');

        head.innerHTML = `<h4>${esc(r.description)}</h4>`
            + (cm ? `<div class="muted">현재: ${esc(cm.type)}${cm.length && cm.type !== 'NUMBER' && cm.type !== 'DATE' ? '(' + esc(cm.length) + ')' : ''}${cm.precision ? '(' + esc(cm.precision) + (cm.scale ? ',' + esc(cm.scale) : '') + ')' : ''} · ${cm.nullable ? 'NULL 허용' : 'NOT NULL'}${cm.comment ? ' · ' + esc(cm.comment) : ''}</div>` : '')
            + `<div class="summary-chips"><div class="chip e"><b>${s.error}</b>에러 예상</div><div class="chip w"><b>${s.warn}</b>주의</div><div class="chip i"><b>${s.info}</b>참고</div>`

                const path = (f.call_paths && f.call_paths[0]) ? f.call_paths[0].join(' → ') : '';
                tr.innerHTML = `<td><span class="badge ${esc(f.severity)}">${esc(SEV_KO[f.severity])}</span>${f.certain === false ? '<div class="path">확실도 낮음</div>' : ''}${f.existing ? '<div class="path">현재도 문제</div>' : ''}</td>`
                    + `<td class="code">${esc(f.code)}</td>`

                    + `<td class="msg-cell"><b>${esc(f.title)}</b><div>${esc(f.message)}</div>${f.host ? `<div class="path mono">${esc(f.host)}</div>` : ''}</td>`
                    + `<td><div>${esc(batch || '-')}</div><div class="path">${esc(path)}</div></td>`;

        if (r.downstream && r.downstream.length) {

    async function loadColumnsFor(name) {

        try {
            const r = await api('/api/tables/' + encodeURIComponent(name.trim()));

    // ---------- DB 조회 ----------
    let curTable = null;
    const DBOBJ = { mode: 'source', owner: null, objects: [], ownersLoaded: false, active: null };
    const TYPE_KO = { 'TABLE': '테이블', 'VIEW': '뷰', 'MATERIALIZED VIEW': 'MView', 'PROCEDURE': '프로시저', 'FUNCTION': '함수',
                      'PACKAGE': '패키지', 'PACKAGE BODY': '패키지 본문', 'TRIGGER': '트리거', 'SEQUENCE': '시퀀스',
                      'SYNONYM': '시노님', 'TYPE': '타입', 'TYPE BODY': '타입 본문' };
    async function loadTables() {
        if (STATUS && STATUS.db.configured) { if (!DBOBJ.objects.length) await loadObjects(false); else renderTableList(); return; }
        if (!TABLES) await loadTableNames();
        renderTableList();
    }
    async function loadObjects(refresh) {
        const info = document.getElementById('objInfo');
        info.textContent = '오브젝트 목록 읽는 중…';
        try {
            if (!DBOBJ.ownersLoaded) {

                document.getElementById('objOwner').innerHTML = o.owners.map(x => `<option>${esc(x)}</option>`).join('');
                DBOBJ.ownersLoaded = true;
            }
            const owner = document.getElementById('objOwner').value;
            const r = await api(`/api/db/objects?owner=${encodeURIComponent(owner)}&refresh=${refresh ? 'true' : 'false'}`);
            DBOBJ.mode = 'db'; DBOBJ.owner = r.owner; DBOBJ.objects = r.objects;
            const sel = document.getElementById('objType'), prev = sel.value;
            sel.innerHTML = '<option value="">전체 종류</option>' + Object.entries(r.counts).map(([t, n]) => `<option value="${esc(t)}">${esc(TYPE_KO[t] || t)} (${n})</option>`).join('');
            sel.value = prev && r.counts[prev] ? prev : (r.counts['TABLE'] ? 'TABLE' : '');

            info.textContent = `${r.owner} · ${r.objects.length}개 · ${r.loaded_at}`;
        } catch (e) {
            DBOBJ.mode = 'source';
            info.textContent = 'DB 목록을 못 읽어 소스 기준 테이블만 보여줍니다: ' + e.message;
            if (!TABLES) await loadTableNames();

        renderTableList();
    }
    function renderTableList() {
        if (DBOBJ.mode === 'db') return renderObjectList();

            + `<div class="sub">${esc(t.comment || '')} · 프로그램 ${t.programs} · R${t.reads}/W${t.writes}</div></div>`).join('') || '<div class="item muted">테이블이 없습니다. 소스를 등록하거나 메타데이터를 가져오세요.</div>';

            let html = `<h4 style="margin-top:0">${esc(r.name)} ${m ? `<span class="muted">${esc(m.owner)} · ${esc(m.comment || '')} · 약 ${esc(m.num_rows ?? '?')}행 · PK ${esc((m.pk || []).join(', ') || '없음')}</span>` : '<span class="muted">(메타데이터 없음)</span>'}</h4>`;
            html += '<div class="row" style="margin-bottom:6px"><button class="ghost small" id="previewBtn">데이터 미리보기</button><button class="ghost small" id="toImpactBtn">이 테이블로 영향도 분석</button></div>';
            html += '<div class="grid-wrap" style="max-height:30vh"><table><thead><tr><th>컬럼</th><th>타입</th><th>NULL</th><th>설명</th><th>사용하는 함수</th></tr></thead><tbody>'
                + r.columns.map(c => `<tr class="clickable" data-col="${esc(c.name)}"><td class="mono">${esc(c.name)}</td><td class="mono">${esc(c.type_text)}</td><td>${c.not_in_meta ? '?' : (c.nullable ? 'Y' : 'N')}</td><td>${esc(c.comment || '')}</td><td class="path">${esc((c.used_by || []).slice(0, 6).join(', '))}${(c.used_by || []).length > 6 ? ' …' : ''}</td></tr>`).join('')

            html += `<h4>사용하는 SQL (${usage.length})</h4><div class="grid-wrap" style="max-height:24vh"><table><thead><tr><th>프로그램</th><th>함수</th><th>줄</th><th>종류</th><th>R/W</th></tr></thead><tbody>`
                + usage.map((u, i) => `<tr class="clickable" data-u="${i}"><td>${esc(u.program)}</td><td>${esc(u.function)}</td><td class="num">${esc(u.line)}</td><td>${esc(u.kind)}</td><td>${accBadge(u.access)}</td></tr>`).join('')
                + '</tbody></table></div>';

    function renderObjectList() {
        const f = document.getElementById('tblFilter').value.trim().toUpperCase();
        const t = document.getElementById('objType').value;
        const box = document.getElementById('tblItems');
        const list = DBOBJ.objects.filter(o => (!t || o.type === t) && (!f || o.name.includes(f)));
        const shown = list.slice(0, 800);
        box.innerHTML = shown.map((o, i) => `<div class="item${DBOBJ.active === o.type + '.' + o.name ? ' active' : ''}" data-i="${i}"><b>${esc(o.name)}</b>`
            + ` <span class="badge Q">${esc(TYPE_KO[o.type] || o.type)}</span>${o.status !== 'VALID' ? ' <span class="badge ERROR">INVALID</span>' : ''}</div>`).join('')
            + (list.length > shown.length ? `<div class="item muted">… 외 ${list.length - shown.length}개 (검색으로 좁혀 주세요)</div>` : '')
            || '<div class="item muted">오브젝트가 없습니다.</div>';
        box.querySelectorAll('.item[data-i]').forEach(d => d.onclick = () => { const o = shown[+d.dataset.i]; showObject(DBOBJ.owner, o.name, o.type); });
    }
    function typeText(c) {
        const t = c.type || '?';
        if (['VARCHAR2', 'CHAR', 'NVARCHAR2', 'NCHAR', 'VARCHAR', 'RAW'].includes(t)) return `${t}(${c.length}${c.char_used === 'C' ? ' CHAR' : ''})`;
        if (t === 'NUMBER') return c.precision == null ? 'NUMBER' : (c.scale ? `NUMBER(${c.precision},${c.scale})` : `NUMBER(${c.precision})`);
        return t;
    }
    function sourceBox(text, startLine) {
        const lines = (text || '').replace(/\n$/, '').split('\n');
        return `<div class="grid-wrap" style="max-height:55vh;background:#0f172a"><div class="code-lines">`
            + lines.map((l, i) => `<div><span class="ln">${(startLine || 1) + i}</span>${esc(l)}</div>`).join('') + '</div></div>';
    }
    function objLink(o) { return `<a href="#" class="objlink" data-o="${esc(o.owner)}" data-n="${esc(o.name)}" data-t="${esc(o.type)}">${esc(o.owner)}.${esc(o.name)}</a> <span class="badge Q">${esc(TYPE_KO[o.type] || o.type)}</span>`; }
    async function showObject(owner, name, type) {
        DBOBJ.active = type + '.' + name; renderObjectList();
        const box = document.getElementById('tblDetail');
        box.textContent = `${name} 읽는 중…`;
        try {
            const d = await api(`/api/db/object?owner=${encodeURIComponent(owner)}&name=${encodeURIComponent(name)}&type=${encodeURIComponent(type)}`);
            let html = `<h4 style="margin-top:0">${esc(d.owner)}.${esc(d.name)} <span class="badge Q">${esc(TYPE_KO[d.type] || d.type)}</span>`;
            const t = d.table;
            if (t) html += ` <span class="muted">${esc(t.comment || '')}${t.num_rows != null ? ' · 약 ' + esc(t.num_rows) + '행' : ''} · PK ${esc((t.pk || []).join(', ') || '없음')}</span>`;
            html += '</h4>';
            if (t) {
                html += '<div class="row" style="margin-bottom:6px"><button class="ghost small" id="previewBtn">데이터 미리보기</button><button class="ghost small" id="toImpactBtn">이 테이블로 영향도 분석</button></div>';
                const cu = d.column_usage || {};
                html += '<div class="grid-wrap" style="max-height:32vh"><table><thead><tr><th>컬럼</th><th>타입</th><th>NULL</th><th>설명</th><th>사용하는 Pro*C 함수</th></tr></thead><tbody>'
                    + t.columns.map(c => `<tr class="clickable" data-col="${esc(c.name)}"><td class="mono">${esc(c.name)}</td><td class="mono">${esc(typeText(c))}</td><td>${c.nullable ? 'Y' : 'N'}</td><td>${esc(c.comment || '')}</td><td class="path">${esc((cu[c.name] || []).slice(0, 6).join(', '))}</td></tr>`).join('')
                    + '</tbody></table></div>';
                if (d.indexes && d.indexes.length) html += '<h4>인덱스</h4><ul>' + d.indexes.map(i => `<li class="mono">${esc(i.name)}${i.unique ? ' <span class="badge INFO">UNIQUE</span>' : ''} (${esc(i.columns.join(', '))})</li>`).join('') + '</ul>';
                const pu = d.proc_usage || [];
                html += `<h4>사용하는 Pro*C SQL (${pu.length})</h4>` + (pu.length ? '<div class="grid-wrap" style="max-height:22vh"><table><thead><tr><th>프로그램</th><th>함수</th><th>줄</th><th>종류</th><th>R/W</th></tr></thead><tbody>'
                    + pu.map((u, i) => `<tr class="clickable" data-u="${i}"><td>${esc(u.program)}</td><td>${esc(u.function)}</td><td class="num">${esc(u.line)}</td><td>${esc(u.kind)}</td><td>${accBadge(u.access)}</td></tr>`).join('') + '</tbody></table></div>'
                    : '<div class="muted">등록된 Pro*C 소스에서 쓰는 곳이 없습니다.</div>');
            }
            if (d.used_by) html += `<h4>이 테이블을 참조하는 DB 오브젝트 (${d.used_by.length})</h4>` + (d.used_by.length ? '<ul>' + d.used_by.map(o => `<li>${objLink(o)}</li>`).join('') + '</ul>' : '<div class="muted">없음</div>');
            if (d.trigger) html += `<div class="muted">대상 테이블: <b>${esc(d.trigger.table_owner)}.${esc(d.trigger.table_name)}</b> · ${esc(d.trigger.timing)} ${esc(d.trigger.event)} · ${esc(d.trigger.status)}</div>`;
            if (d.references) html += `<h4>참조하는 오브젝트 (${d.references.length})</h4>` + (d.references.length ? '<ul>' + d.references.map(o => `<li>${objLink(o)}</li>`).join('') + '</ul>' : '<div class="muted">없음</div>');
            if (d.sequence) html += '<ul>' + Object.entries(d.sequence).map(([k, v]) => `<li>${esc(k)}: <b>${esc(v)}</b></li>`).join('') + '</ul>';
            if (d.synonym) html += `<div>→ ${objLink({ owner: d.synonym.table_owner, name: d.synonym.table_name, type: 'TABLE' })}${d.synonym.db_link ? ' @' + esc(d.synonym.db_link) : ''}</div>`;
            if (d.source != null) html += `<h4>소스${d.lines ? ` (${d.lines}줄)` : ''}</h4>` + sourceBox(d.source);
            box.innerHTML = html;
            box.querySelectorAll('a.objlink').forEach(a => a.onclick = (e) => { e.preventDefault(); showObject(a.dataset.o, a.dataset.n, a.dataset.t); });
            if (t) {
                const pu = d.proc_usage || [];
                box.querySelectorAll('tr[data-u]').forEach(tr => tr.onclick = () => { const u = pu[+tr.dataset.u]; openProgramLine(u.program, u.line); });
                box.querySelectorAll('tr[data-col]').forEach(tr => tr.onclick = () => {
                    document.getElementById('impTable').value = d.name; document.getElementById('impColumn').value = tr.dataset.col;
                    loadColumnsFor(d.name); gotoTab('impact');
                });
                document.getElementById('previewBtn').onclick = () => { document.getElementById('sqlText').value = `SELECT * FROM ${d.owner}.${d.name} WHERE ROWNUM <= 100`; runSql(); };
                document.getElementById('toImpactBtn').onclick = () => { document.getElementById('impTable').value = d.name; loadColumnsFor(d.name); gotoTab('impact'); };
            }
        } catch (e) { box.textContent = e.message; }
    }
    async function runSql() {
        const sql = document.getElementById('sqlText').value;
        const max = parseInt(document.getElementById('sqlMax').value, 10) || 200;
        const out = document.getElementById('sqlResult');
        document.getElementById('sqlBtn').disabled = true;
        setStatus('sqlStatus', '실행 중…');
        const t0 = performance.now();
        try {
            const r = await postJson('/api/db/query', { sql, max_rows: max });
            setStatus('sqlStatus', `${r.row_count}행${r.truncated ? ' (최대 행에서 잘림)' : ''} · ${Math.round(performance.now() - t0)}ms`, 'ok');
            out.replaceChildren(gridNode(r));
        } catch (e) { setStatus('sqlStatus', e.message, 'err'); out.replaceChildren(); }
        finally { document.getElementById('sqlBtn').disabled = false; }
    }
    function gridNode(r) {
        const wrap = el('div', 'grid-wrap');
        const t = el('table');
        t.innerHTML = '<thead><tr><th>#</th>' + r.columns.map(c => `<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>'
            + r.rows.map((row, i) => `<tr><td class="num">${i + 1}</td>` + row.map(v => v === null ? '<td class="muted">(null)</td>' : `<td title="${esc(v)}">${esc(v)}</td>`).join('') + '</tr>').join('')
            + '</tbody>';
        wrap.appendChild(t);
        return wrap;
    }

    // ---------- 소스 · 배치 ----------
    const EXPLORE = { kind: 'programs', loaded: false, programs: [], batches: [], active: null };
    async function loadExplore() {
        if (EXPLORE.loaded) { renderExploreList(); return; }
        try {
            const [p, b] = await Promise.all([api('/api/programs'), api('/api/batches')]);
            EXPLORE.programs = p.programs; EXPLORE.batches = b.scripts; EXPLORE.loaded = true;
        } catch (e) { document.getElementById('expItems').textContent = e.message; return; }
        renderExploreList();
    }
    function setExploreKind(kind, btn) {
        EXPLORE.kind = kind;
        document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('active', b === btn));
        renderExploreList();
    }
    function renderExploreList() {
        const f = document.getElementById('expFilter').value.trim().toLowerCase();
        const box = document.getElementById('expItems');
        if (EXPLORE.kind === 'programs') {
            const list = EXPLORE.programs.filter(p => !f || p.program.toLowerCase().includes(f) || p.tables.some(t => t.name.toLowerCase().includes(f)));
            box.innerHTML = list.map(p => `<div class="item" data-p="${esc(p.program)}"><b>${esc(p.program)}</b> ${p.has_main ? '' : '<span class="badge Q">라이브러리</span>'}`
                + `<div class="sub">함수 ${p.functions} · SQL ${p.sql} · 테이블 ${p.tables.length}${p.batch.length ? ' · ' + esc(p.batch.map(b => b.script + ' #' + (b.order ?? '?')).join(', ')) : ''}</div></div>`).join('')
                || '<div class="item muted">등록된 프로그램이 없습니다.</div>';

                            + `<td>${s.tables.map(t => esc(t.name) + ' ' + accBadge(t.access)).join('<br>')}${s.guessed_tables.map(t => esc(t) + ' ' + accBadge('?')).join('<br>')}</td><td class="mono path">${esc(s.sql.slice(0, 220))}</td></tr>`).join('')

    // ---------- 코드 보기 ----------
    const CODE = { file: null, start: 1, end: 1, hl: 0, hlEnd: 0, total: 0 };
    async function openProgramLine(program, line) {
        const p = (EXPLORE.programs.length ? EXPLORE.programs : (await api('/api/programs')).programs).find(x => x.program === program);
        if (p) openCode(p.file_name, line, program);
    }
    function openCode(file, line, title, hlStart, hlEnd) {
        CODE.file = file; CODE.hl = hlStart || line; CODE.hlEnd = hlEnd || line;
        CODE.start = Math.max(1, (hlStart || line) - 15); CODE.end = (hlEnd || line) + 30;
        document.getElementById('codeTitle').textContent = title || file;
        document.getElementById('codeSub').textContent = `${file}:${line}`;
        document.getElementById('codeModal').classList.add('open');
        loadCode(true);
    }
    async function loadCode(scrollToHl) {
        const box = document.getElementById('codeLines');
        try {
            const r = await api(`/api/source/${encodeURIComponent(CODE.file)}?start=${CODE.start}&end=${CODE.end}`);
            CODE.total = r.total; CODE.end = r.end;
            let inSql = false;
            box.innerHTML = r.lines.map((t, i) => {
                const n = r.start + i;
                if (/EXEC\s+SQL/i.test(t)) inSql = true;
                const cls = (n >= CODE.hl && n <= CODE.hlEnd ? 'hl ' : '') + (inSql ? 'sql' : '');
                const html = `<div class="${cls}" ${n === CODE.hl ? 'id="hlLine"' : ''}><span class="ln">${n}</span>${esc(t)}</div>`;
                if (inSql && /;\s*$|END-EXEC/i.test(t)) inSql = false;
                return html;
            }).join('');
            if (scrollToHl) document.getElementById('hlLine')?.scrollIntoView({ block: 'center' });
        } catch (e) { box.textContent = e.message; }
    }
    function moreCode(n) {
        if (n < 0) CODE.start = Math.max(1, CODE.start + n); else CODE.end = Math.min(CODE.total || CODE.end + n, CODE.end + n);
        loadCode(false);
    }
    function closeCode() { document.getElementById('codeModal').classList.remove('open'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCode(); });

    loadStatus();
    welcome();
</script>
</body>
</html>
